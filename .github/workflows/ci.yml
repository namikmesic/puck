name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Container runner syntax
        run: node --check src/main/runner/runner.js
      - name: Unit tests
        run: npm test
      - name: Definitions schema is current
        run: |
          npm run schema
          git diff --exit-code schema/ docs/examples/config-repo/puck.schema.json
      - name: Puck server bundle (Node built-ins only)
        run: npm run build:server
      - name: Build the environment daemon
        run: npm run build:daemon
      - name: Environment daemon runs
        run: node .webpack/daemon/puckd.js version

  daemon-docker:
    # The daemon's Docker suite needs a Docker engine; macOS runners have none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the environment daemon
        run: npm run build:daemon
      - name: Docker suite (real containers, fake harness)
        run: npm run test:docker

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the app (fails without a fresh app bundle under out/)
        run: npm run package

  server-image:
    # macOS runners have no Docker; the server image is Linux anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the puck-server image and bring it up with Compose
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Health check
        run: curl -fsS http://127.0.0.1:8765/healthz
      - name: Server logs
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
