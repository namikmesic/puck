name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Definitions schema is current
        run: |
          npm run schema
          git diff --exit-code schema/ docs/examples/config-repo/puck.schema.json
      - name: Puck server bundle (Node built-ins only)
        run: npm run build:server
      - name: Build the environment daemon
        run: npm run build:daemon
      - name: Environment daemon runs
        run: node .webpack/daemon/puckd.js version
      - name: Runner bundle (Node built-ins only)
        run: npm run build:runner
      - name: macOS runner tarball runs config.sh --help on its bundled Node
        run: |
          npm run package:runner -- --targets macos-arm64
          mkdir -p "$RUNNER_TEMP/puck-runner" && cd "$RUNNER_TEMP/puck-runner"
          VERSION=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          tar xzf "$GITHUB_WORKSPACE/out/puck-runner/$VERSION/puck-runner-macos-arm64-$VERSION.tar.gz"
          ./config.sh --help
          ./bin/node --version
          ./bin/node bin/puck-runner.cjs version --json | grep -F '"trustMode":"development"'

  daemon-docker:
    # The daemon's Docker suite needs a Docker engine; macOS runners have none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner tarball scenario runs the linux-arm64 tarball under emulation.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build the environment daemon
        run: npm run build:daemon
      - name: Docker suite (real containers, fake harness, real puck-runner processes)
        run: npm run test:docker

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the app (fails without a fresh app bundle under out/)
        run: npm run package

  server-image:
    # macOS runners have no Docker; the server image is Linux anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build the development puck-server image and bring it up with Compose
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Health check
        run: curl -fsS http://127.0.0.1:8765/healthz
      - name: The development server offers this version's runner packages, and each download matches its sha256
        run: node scripts/check-runner-downloads.mjs http://localhost:8765
      - name: Build the default puck-server image and run it
        run: |
          docker build -f src/server/Dockerfile -t puck-server .
          docker run -d --name puck-server-default -p 127.0.0.1:8766:8080 -e PUCK_SERVER_URL=http://localhost:8766 puck-server
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:8766/healthz; do sleep 1; done'
      - name: The default image carries no runner packages and serves none
        run: |
          docker run --rm --entrypoint sh puck-server -c 'test ! -e /app/runner-downloads'
          node scripts/check-runner-downloads.mjs --none http://localhost:8766
      - name: Server logs
        if: always()
        run: |
          docker compose logs
          docker logs puck-server-default || true
      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker rm -f puck-server-default || true
