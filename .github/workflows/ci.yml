name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (strict)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Container runner syntax
        run: node --check src/main/runner/runner.js
      - name: Unit tests
        run: npm test
      - name: Definitions schema is current
        run: |
          npm run schema
          git diff --exit-code schema/ docs/examples/config-repo/puck.schema.json

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the app (fails without a fresh app bundle under out/)
        run: npm run package
